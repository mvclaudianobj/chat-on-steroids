name: Firefox signing check

# Run by hand to prove the AMO credentials and Mozilla's validation before a release depends on
# them. Mozilla signs each version once. A check from 2.1.38.1 signs numeric 2.1.38.1001
# under a dedicated test Gecko ID, leaving all production versions available. The package is kept as an
# artifact for testing; it is never attached to a release.
#   gh workflow run firefox-sign-check.yml
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    name: Sign a test build of the Firefox add-on
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Stage a test version
        run: |
          set -euo pipefail
          node scripts/write-extension-stamp.mjs
          node scripts/stage-firefox-extension.mjs release/firefox-extension
          version="$(node scripts/firefox-update-manifest.mjs --test-version "$GITHUB_RUN_NUMBER")"
          test_id="$(node scripts/firefox-update-manifest.mjs --test-id)"
          node -e "const f='release/firefox-extension/manifest.json',fs=require('fs'),m=JSON.parse(fs.readFileSync(f,'utf8'));m.version=process.argv[1];m.browser_specific_settings.gecko.id=process.argv[2];delete m.browser_specific_settings.gecko.update_url;fs.writeFileSync(f,JSON.stringify(m,null,2)+'\n')" "$version" "$test_id"
          echo "Signing test version $version"
          npx --yes web-ext@10.7.0 lint --source-dir release/firefox-extension --self-hosted

      - name: Sign with Mozilla
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::error::Set the AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets (addons.mozilla.org → Manage API Keys)." >&2
            exit 1
          fi
          npx --yes web-ext@10.7.0 sign --channel=unlisted --source-dir release/firefox-extension \
            --artifacts-dir release/firefox-signed --approval-timeout 1500000
          shopt -s nullglob
          signed=(release/firefox-signed/*.xpi)
          if [ "${#signed[@]}" -ne 1 ]; then echo "Expected exactly one Mozilla-signed XPI, found ${#signed[@]}" >&2; exit 1; fi
          version="$(node scripts/firefox-update-manifest.mjs --test-version "$GITHUB_RUN_NUMBER")"
          node scripts/firefox-update-manifest.mjs --verify-signed "${signed[0]}" "$version" --test-addon

      - name: Keep the signed test package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefox-sign-check-${{ github.run_number }}
          path: release/firefox-signed/
          if-no-files-found: error
          retention-days: 7
