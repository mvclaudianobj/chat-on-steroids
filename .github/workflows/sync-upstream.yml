name: Sync upstream

# Early warning only. Every day it merges the community's main into sync/upstream and runs the
# full verify with the Marks guards, so a conflict or a broken Marks contract shows up as an issue
# while it is one day of upstream work. The branch is never merged into main: main receives the
# community only through a published release tag, so Chat Marks X.Y.Z.N always means community
# X.Y.Z plus Marks revision N (marks-community-merge skill).

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/totec448-spec/chat-on-steroids
  BRANCH: sync/upstream
  GH_TOKEN: ${{ github.token }}

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Merge upstream main
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # --no-tags: community tags must never overwrite the fork's own release tags.
          git fetch --no-tags "$UPSTREAM" main:refs/remotes/upstream/main
          if git merge-base --is-ancestor refs/remotes/upstream/main origin/main; then
            echo "main already contains upstream main"; echo "state=current" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Keep extending the same branch: no force push, and earlier resolutions stay.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git merge --no-ff --no-edit origin/main
          else
            git checkout -B "$BRANCH" origin/main
          fi
          if ! git merge --no-ff --no-edit -m "sync: merge upstream main $(git rev-parse --short refs/remotes/upstream/main)" refs/remotes/upstream/main; then
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "state=conflict" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "state=merged" >> "$GITHUB_OUTPUT"

      - name: Report conflicts
        if: steps.merge.outputs.state == 'conflict'
        run: |
          title='Sync upstream: conflito com a comunidade'
          body=$(printf 'upstream main `%s` não mescla sozinho em `%s`.\n\nArquivos em conflito:\n%s\n\nResolver com a skill marks-community-merge, preservando Marks.\n\nRun: %s/%s/actions/runs/%s' \
            "$(git rev-parse --short refs/remotes/upstream/main)" "$BRANCH" "$(sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts.txt")" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          issue=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then gh issue comment "$issue" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
          exit 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.merge.outputs.state == 'merged'
        with:
          node-version: 22
          cache: npm

      - name: Verify with Marks guards
        id: verify
        if: steps.merge.outputs.state == 'merged'
        continue-on-error: true
        env:
          COS_TEST_RETRY: '1'
        run: npm ci && npm run verify:ci

      - name: Publish branch
        if: steps.merge.outputs.state == 'merged'
        run: git push origin "HEAD:refs/heads/$BRANCH"

      - name: Report broken Marks contracts
        if: steps.merge.outputs.state == 'merged' && steps.verify.outcome != 'success'
        run: |
          title='Sync upstream: verify falhou com a comunidade'
          body=$(printf 'upstream main `%s` mesclado em `%s`, mas `verify:ci` falhou.\n\nCorrigir em main antes da próxima tag da comunidade.\n\nRun: %s/%s/actions/runs/%s' \
            "$(git rev-parse --short refs/remotes/upstream/main)" "$BRANCH" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          issue=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then gh issue comment "$issue" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
          exit 1
